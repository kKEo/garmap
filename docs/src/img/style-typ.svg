<text x="974.0" y="448.0" font-size="11" fill="#5b6770" text-anchor="end" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">No custom (0x10000+) types: they would draw but not route.</text>
