<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">Download cache decision flow</title>
<desc id="d">http.download reuses a cached file younger than 14 days, revalidates older ones by ETag, and writes new downloads to a .part file before renaming.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0050C8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4d"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="519" rx="12" fill="#fbfaf7" stroke="#d9dde2"/>
<text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">http.download() — when a cached file is reused</text>
<text x="24.0" y="54.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Used for Geofabrik extracts and for the mkgmap / splitter release zips.</text>
<polygon points="275.0,110 400,75.0 525.0,110 400,145.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="400.0" y="106.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">file cached and</text>
<text x="400.0" y="121.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no --refresh?</text>
<polygon points="275.0,210 400,175.0 525.0,210 400,245.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="400.0" y="206.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">younger than</text>
<text x="400.0" y="221.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">14 days?</text>
<polygon points="275.0,310 400,275.0 525.0,310 400,345.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="400.0" y="306.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">.etag sidecar</text>
<text x="400.0" y="321.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">present?</text>
<rect x="290.0" y="385.0" width="220.0" height="50.0" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="400.0" y="406.5" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">HEAD</text>
<text x="400.0" y="422.0" font-size="11.5" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">If-None-Match: &lt;etag&gt;</text>
<path d="M400.0,145.0 L400.0,175.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="416.0" y="164.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">yes</text>
