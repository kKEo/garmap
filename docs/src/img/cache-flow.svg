<rect x="24.0" y="185.0" width="192.0" height="50.0" rx="8" fill="#e4f4ea" stroke="#1b7f4d" stroke-width="1.4"/>
<text x="120.0" y="206.8" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">return cached file</text>
<text x="120.0" y="221.8" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no network at all</text>
<path d="M275.0,210.0 L216.0,210.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="250.0" y="203.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">yes</text>
<rect x="24.0" y="360.0" width="192.0" height="50.0" rx="8" fill="#e4f4ea" stroke="#1b7f4d" stroke-width="1.4"/>
<text x="120.0" y="381.8" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">return cached file</text>
<text x="120.0" y="396.8" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">304: mtime reset</text>
<rect x="24.0" y="430.0" width="192.0" height="50.0" rx="8" fill="#e4f4ea" stroke="#1b7f4d" stroke-width="1.4"/>
<text x="120.0" y="451.8" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">return cached file</text>
<text x="120.0" y="466.8" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">request failed: offline</text>
