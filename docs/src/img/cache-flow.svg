<text x="252.0" y="386.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">304</text>
<path d="M290.0,422.0 L216.0,452.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="252.0" y="452.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">error</text>
<rect x="590.0" y="85.0" width="200.0" height="50.0" rx="8" fill="#e6eefb" stroke="#0050C8" stroke-width="1.4"/>
<text x="690.0" y="106.5" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">GET, streamed</text>
<text x="690.0" y="122.0" font-size="11.5" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">into &lt;file&gt;.part</text>
<path d="M525.0,110.0 L590.0,110.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="545.0" y="103.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no</text>
<path d="M525.0,310.0 L560.0,310.0 L560.0,126.0 L590.0,126.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="545.0" y="303.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no</text>
<path d="M510.0,410.0 L575.0,410.0 L575.0,131.0 L590.0,131.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="518.0" y="428.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">any other status</text>
<polygon points="590.0,210 690,175.0 790.0,210 690,245.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
