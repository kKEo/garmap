<path d="M790.0,210.0 L880.0,210.0 L880.0,285.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="838.0" y="203.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">request error</text>
