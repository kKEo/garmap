<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
<title id="t">garmap install decision flow</title>
<desc id="d">install copies to a mounted Garmin volume if one exists, otherwise uses mtp-sendfile if available, otherwise prints manual instructions.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0050C8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4d"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="439" rx="12" fill="#fbfaf7" stroke="#d9dde2"/>
<text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">garmap install — three paths, tried in order</text>
<text x="24.0" y="54.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">The Edge 1040 is MTP-only, so on macOS the first path usually finds nothing.</text>
<polygon points="50.0,130 190,90.0 330.0,130 190,170.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="190.0" y="126.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">volume under /Volumes</text>
<text x="190.0" y="141.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">with a Garmin/ folder?</text>
<polygon points="50.0,260 190,220.0 330.0,260 190,300.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="190.0" y="256.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">--mtp (default) and</text>
<text x="190.0" y="271.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">mtp-sendfile on PATH?</text>
<path d="M190.0,170.0 L190.0,220.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="212.0" y="200.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">none</text>
<rect x="80.0" y="350.0" width="220.0" height="56.0" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="190.0" y="374.8" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">print manual steps</text>
<text x="190.0" y="389.8" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">MTP mode · OpenMTP · Garmin/Map/</text>
<path d="M190.0,300.0 L190.0,350.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="208.0" y="330.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no</text>
<rect x="410.0" y="107.0" width="180.0" height="46.0" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="500.0" y="126.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">several volumes?</text>
<text x="500.0" y="141.5" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">prompt for one</text>
<path d="M330.0,130.0 L410.0,130.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="370.0" y="123.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">one or more</text>
<polygon points="605.0,130 700,95.0 795.0,130 700,165.0" fill="#fff4d6" stroke="#9a6700" stroke-width="1.4"/>
<text x="700.0" y="126.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">target exists,</text>
<text x="700.0" y="141.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no --force?</text>
<path d="M590.0,130.0 L605.0,130.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="830.0" y="107.0" width="150.0" height="46.0" rx="8" fill="#fbe9ec" stroke="#C8102E" stroke-width="1.4"/>
<text x="905.0" y="126.8" font-size="12" fill="#C8102E" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">GarmapError</text>
<text x="905.0" y="141.2" font-size="10.5" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">use --force / --name</text>
<path d="M795.0,130.0 L830.0,130.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="812.0" y="123.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">yes</text>
<rect x="610.0" y="196.0" width="180.0" height="50.0" rx="8" fill="#e4f4ea" stroke="#1b7f4d" stroke-width="1.4"/>
<text x="700.0" y="217.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">copy to</text>
<text x="700.0" y="232.5" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">&lt;volume&gt;/Garmin/Map/&lt;name&gt;</text>
<path d="M700.0,165.0 L700.0,196.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="716.0" y="185.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">no</text>
<rect x="410.0" y="236.0" width="180.0" height="50.0" rx="8" fill="#e6eefb" stroke="#0050C8" stroke-width="1.4"/>
<text x="500.0" y="257.5" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mtp-sendfile IMG</text>
<text x="500.0" y="272.5" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Garmin/Map/&lt;name&gt;</text>
<path d="M330.0,260.0 L410.0,260.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="370.0" y="253.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">yes</text>
<rect x="610.0" y="300.0" width="180.0" height="46.0" rx="8" fill="#e4f4ea" stroke="#1b7f4d" stroke-width="1.4"/>
<text x="700.0" y="327.2" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">sent over MTP</text>
<path d="M590.0,270.0 L700.0,270.0 L700.0,300.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="650.0" y="263.0" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">exit 0</text>
<rect x="410.0" y="350.0" width="380.0" height="56.0" rx="8" fill="#fbe9ec" stroke="#C8102E" stroke-width="1.4"/>
<text x="600.0" y="374.8" font-size="12.5" fill="#C8102E" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">GarmapError: mtp-sendfile failed</text>
<text x="600.0" y="389.8" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">its output, followed by the manual steps</text>
<path d="M500.0,286.0 L500.0,350.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="508.0" y="322.0" font-size="11" fill="#1f2933" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">non-zero exit</text>
<text x="820.0" y="222.0" font-size="11" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">then: map-list-cap reminder</text>
<text x="820.0" y="326.0" font-size="11" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-style="italic">then: map-list-cap reminder</text>
</svg>
