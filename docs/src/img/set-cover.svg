<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Greedy extract selection</title>
<desc id="d">A corridor crossing two voivodeships inside Poland: the greedy set cover picks the two small extracts rather than the country, and ignores a sliver over the border.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0050C8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b7f4d"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="469" rx="12" fill="#fbfaf7" stroke="#d9dde2"/>
<text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Choosing extracts — weighted greedy set cover</text>
<text x="24.0" y="54.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Each round takes the candidate with the most newly covered corridor per unit of its own area. Numbers are illustrative.</text>
<rect x="30" y="80" width="400" height="290" rx="26" fill="#eef1f4" stroke="#8a96a3" stroke-dasharray="6 4" stroke-width="1.4"/>
<text x="48.0" y="102.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">poland  (parent)</text>
<rect x="70" y="190" width="150" height="160" rx="14" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<rect x="220" y="170" width="170" height="180" rx="14" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="145.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">malopolskie</text>
<text x="305.0" y="192.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">podkarpackie</text>
<rect x="30" y="372" width="400" height="70" rx="14" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="90.0" y="414.0" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slovakia</text>
<path d="M105,300 C120,250 180,240 215,270 C250,300 290,250 330,262 C362,272 366,320 335,334 C300,350 276,404 238,366 C200,338 150,362 122,346 C104,336 98,320 105,300 Z" fill="#0050C8" fill-opacity="0.2" stroke="#0050C8" stroke-width="1.6"/>
<path d="M128,318 C160,270 200,300 235,318 C270,336 300,290 338,300" fill="none" stroke="#C8102E" stroke-width="2.4"/>
<path d="M262.0,404.0 L262.0,384.0" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#a)"/>
<text x="190.0" y="420.0" font-size="11" fill="#9a6700" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">sliver &lt; 0.1 % of corridor: ignored</text>
<text x="470.0" y="96.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">score = newly covered corridor ÷ region area</text>
<text x="470.0" y="132.0" font-size="12.5" fill="#0050C8" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Round 1</text>
<rect x="464" y="137" width="506" height="22" rx="5" fill="#e4f4ea" stroke="#1b7f4d"/>
<text x="474.0" y="152.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">malopolskie</text>
<text x="620.0" y="152.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">58 % ÷ 1.9</text>
<text x="870.0" y="152.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.31</text>
<text x="960.0" y="152.0" font-size="11.5" fill="#1b7f4d" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">✓ chosen</text>
<text x="474.0" y="176.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">podkarpackie</text>
<text x="620.0" y="176.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">42 % ÷ 2.2</text>
<text x="870.0" y="176.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.19</text>
<text x="474.0" y="200.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">poland</text>
<text x="620.0" y="200.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">100 % ÷ 40</text>
<text x="870.0" y="200.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.03</text>
<text x="474.0" y="224.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">slovakia</text>
<text x="620.0" y="224.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">gain 0.05 % &lt; MIN_GAIN</text>
<text x="870.0" y="224.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">skip</text>
<text x="470.0" y="258.0" font-size="12.5" fill="#0050C8" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Round 2</text>
<rect x="464" y="263" width="506" height="22" rx="5" fill="#e4f4ea" stroke="#1b7f4d"/>
<text x="474.0" y="278.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">podkarpackie</text>
<text x="620.0" y="278.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">42 % ÷ 2.2</text>
<text x="870.0" y="278.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.19</text>
<text x="960.0" y="278.0" font-size="11.5" fill="#1b7f4d" text-anchor="end" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">✓ chosen</text>
<text x="474.0" y="302.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">poland</text>
<text x="620.0" y="302.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">42 % ÷ 40</text>
<text x="870.0" y="302.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">0.01</text>
<text x="470.0" y="334.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Stop: less than 0.1 % of the corridor is still uncovered (COVERAGE_TARGET = 0.999).</text>
<rect x="464.0" y="354.0" width="245.0" height="62.0" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="586.5" y="374.2" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">drop redundant</text>
<text x="586.5" y="389.2" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">a region whose ancestor was</text>
<text x="586.5" y="404.2" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">also chosen is removed</text>
<rect x="725.0" y="354.0" width="245.0" height="62.0" rx="8" fill="#ffffff" stroke="#8a96a3" stroke-width="1.4"/>
<text x="847.5" y="374.2" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">more than 6 regions?</text>
<text x="847.5" y="389.2" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">replace them all with their</text>
<text x="847.5" y="404.2" font-size="11" fill="#5b6770" text-anchor="middle" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">smallest common ancestor</text>
<path d="M709.0,385.0 L725.0,385.0" fill="none" stroke="#5b6770" stroke-width="1.6" marker-end="url(#a)"/>
<text x="464.0" y="440.0" font-size="12" fill="#1b7f4d" text-anchor="start" font-weight="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Result here: malopolskie + podkarpackie — two small downloads instead of all of Poland.</text>
</svg>
