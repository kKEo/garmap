<rect x="0.5" y="0.5" width="999" height="411" rx="12" fill="#fbfaf7" stroke="#d9dde2"/>
<text x="24.0" y="34.0" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">Map ids — two numbering steps</text>
<text x="24.0" y="54.0" font-size="12" fill="#5b6770" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">splitter names tile files from per-extract blocks; mkgmap.args then assigns the ids that end up in the .img.</text>
