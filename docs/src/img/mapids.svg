<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412" role="img" aria-labelledby="t d">
<title id="t">Map id allocation</title>
<desc id="d">splitter is given a block of 1000 map ids per extract starting at 63240001; contour tiles start at 63250001; mkgmap.args then renumbers OSM tiles consecutively.</desc>
